name: "CI: lint"

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Run linters
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Get user information
        run: |
          {
            echo "MEGALINTER_UID=$(id -u)"
            echo "MEGALINTER_GID=$(id -g)"
            echo "MEGALINTER_USER=$(id -un)"
          } >> "$GITHUB_ENV"

      - name: MegaLinter
        id: ml
        uses: oxsecurity/megalinter@f2fe8c1cba37091848df3e524066c8c23ef353ed # v10.2.0
        env:
          VALIDATE_ALL_CODEBASE: true
          GITHUB_TOKEN: ${{ github.token }}
          # new non-root user feature
          MEGALINTER_UID: ${{ env.MEGALINTER_UID }}
          MEGALINTER_GID: ${{ env.MEGALINTER_GID }}
          MEGALINTER_USER: ${{ env.MEGALINTER_USER }}
          # shfmt shall prefer 2 spaces to indent not tabs
          BASH_SHFMT_ARGUMENTS: -indent 2 -case-indent

  ensure-immutable-actions:
    name: Run ensure-immutable-actions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Ensure workflow actions use immutable refs
        uses: joshjohanning/ensure-immutable-actions@8962e4b529ca98ec01992c65d0af9efba9eb88b5 # v2.7.3
        with:
          include-first-party: "true"
          write-job-summary: "on-failure-only"
